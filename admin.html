<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隨身小老師｜管理頁面</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 管理頁：上方工具列選日期與裝置，下面依時間列出每筆紀錄；配色沿用隨身小老師的黑板綠 */
:root {
  --wall: #e8ebe5; --panel: #f8f9f5; --ink: #1e2924; --muted: #5d6c64; --line: #d0d8d1;
  --accent: #2c6a4f; --accent-ink: #fff; --accent-soft: #dcebe2; --warn: #a8481f; --warn-soft: #f6e3d9;
  --font: "Noto Sans TC", "Microsoft JhengHei UI", "PingFang TC", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --wall: #111614; --panel: #1a211e; --ink: #e5ebe7; --muted: #9aa8a0; --line: #2e3833; --accent: #7cc4a0; --accent-ink: #0f1a14; --accent-soft: #1f3329; --warn: #f0a17b; --warn-soft: #3a2419; color-scheme: dark; }
}
:root[data-theme="dark"] { --wall: #111614; --panel: #1a211e; --ink: #e5ebe7; --muted: #9aa8a0; --line: #2e3833; --accent: #7cc4a0; --accent-ink: #0f1a14; --accent-soft: #1f3329; --warn: #f0a17b; --warn-soft: #3a2419; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--wall); color: var(--ink); font: 15px/1.6 var(--font); }
.page { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 1.3rem; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top .spacer { flex: 1; }
button, select, input { font: inherit; color: inherit; }
/* iPhone 點到字小於 16px 的輸入欄會自動放大頁面，而且不會縮回來 */
select, input { font-size: max(16px, 1em); }
.btn { min-height: 44px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--accent-soft); color: var(--accent); cursor: pointer; font-weight: 500; text-decoration: none; transition: filter .15s, box-shadow .15s; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.secondary { background: #e1eaf7; color: #234f87; border-color: #a5bddb; }
.btn.selected { background: #fff0b8; color: #644800; border-color: #b99531; }
.btn:hover:not(:disabled) { filter: brightness(.95); }
.btn:disabled { opacity: .55; cursor: wait; }
#logout, #voice-stop { background: var(--warn-soft); color: var(--warn); }
#password-toggle { background: var(--panel); color: var(--muted); }
.load-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px; border-radius: 10px; background: var(--wall); }
.load-toolbar select { flex: 1; min-width: 130px; min-height: 44px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.secondary { background: #243750; color: #b5d2fa; border-color: #4b678b; } :root:not([data-theme="light"]) .btn.selected { background: #483c1e; color: #ffe396; border-color: #8f7536; } }
:root[data-theme="dark"] .btn.secondary { background: #243750; color: #b5d2fa; border-color: #4b678b; }
:root[data-theme="dark"] .btn.selected { background: #483c1e; color: #ffe396; border-color: #8f7536; }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.card { min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
#panel { min-width: 0; display: grid; gap: 16px; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 12px; }
.settings-grid label { display: grid; gap: 6px; min-width: 0; }
.settings-grid select, .library-filters input, .library-filters select { width: 100%; min-width: 0; min-height: 44px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.library-filters { display: flex; flex-wrap: wrap; gap: 8px; }.library-filters input { flex: 1; }.library-filters select { width: auto; }
.library-categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 10px; margin-bottom: 12px; }
.library-categories label { display: grid; gap: 5px; min-width: 0; color: var(--muted); }
.library-categories select { width: 100%; min-width: 0; min-height: 44px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.library-group-heading { margin: 22px 0 8px; padding: 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 1rem; overflow-wrap: anywhere; }
.library-card { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; overflow-wrap: anywhere; }.library-card h3 { margin: 0; }
.library-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.login { max-width: 420px; display: grid; gap: 10px; }
.login-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.password-field { position: relative; min-width: 0; }
.password-field input { width: 100%; padding-right: 48px !important; }
.password-eye { position: absolute; right: 1px; top: 0; bottom: 0; width: 44px; min-height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
.password-eye[aria-pressed="true"] { color: var(--accent); }
.password-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.password-eye svg { pointer-events: none; }
.password-eye .eye-slash[hidden] { display: none; }
.login input { min-width: 0; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--wall); }
.error { margin: 0; color: var(--warn); }
.muted { color: var(--muted); }
.toolbar { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; }
.toolbar label { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .9rem; }
.toolbar select { min-height: 40px; max-width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.summary { font-size: .9rem; color: var(--muted); }
.usage-stats { margin: 0; min-width: 0; }
.admin-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; position: sticky; top: 8px; z-index: 5; }
.admin-tabs button { min-height: 44px; min-width: 0; padding: 6px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 700; }
.admin-tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.admin-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tab-content { display: grid; gap: 12px; min-width: 0; }
.data-controls { padding: 8px; }.data-controls .load-toolbar { padding: 0; background: transparent; }.data-controls p { margin: 6px 4px 0; font-size: .8rem; }
#admin-dashboard .toolbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; padding: 12px; }
#admin-dashboard .toolbar label { display: grid; gap: 4px; min-width: 0; }#admin-dashboard .toolbar select { width: 100%; min-width: 0; min-height: 44px; }#admin-dashboard .summary { grid-column: 1 / -1; }
.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.metric { min-width: 0; padding: 10px; background: var(--accent-soft); border-radius: 10px; }
.metric span { display: block; color: var(--muted); font-size: .8rem; }.metric strong { display: block; font-size: 1.3rem; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.model-list { display: grid; gap: 8px; margin-top: 12px; }.model-usage { min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.model-usage > summary { font-size: .9rem; color: var(--ink); overflow-wrap: anywhere; }.model-name { font-weight: 700; }.model-brief { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; font-size: .8rem; color: var(--muted); }
.usage-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0 0; }.usage-details div { min-width: 0; padding: 8px; border-radius: 8px; background: var(--wall); }.usage-details dt { color: var(--muted); font-size: .8rem; }.usage-details dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.records-expand { min-width: 0; }.records-expand > summary { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: .9rem; }.records-expand .entries { margin-top: 12px; }
#admin-settings h2 { margin: 0 0 12px; font-size: 1.1rem; }#admin-settings .settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }#admin-settings .settings-grid label { gap: 4px; font-size: .85rem; }#admin-settings select { padding: 6px; min-height: 44px; }
#admin-voice .settings-grid label { min-width: 0; }
#admin-voice .study-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }#admin-voice .study-actions .btn { flex: 1; padding: 6px; font-size: .85rem; }
.settings-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }.settings-footer p { flex: 1; margin: 0; font-size: .85rem; }.settings-note { margin-top: 8px; }.compact-note { font-size: .85rem; margin: 12px 0 0; }
#voice-status:empty, #settings-status:empty { display: none; }
@media (min-width: 760px) { #admin-settings .settings-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }#admin-voice .settings-grid label:has(#voice-chinese), #admin-voice .settings-grid label:has(#voice-english) { grid-column: span 2; } }
@media (max-width: 560px) { .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }#admin-dashboard .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }.page { padding: 12px; gap: 12px; }.card { padding: 12px; } }
.entries { display: grid; gap: 12px; }
.entry { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; }
.entry.no-photo { grid-template-columns: minmax(0, 1fr); }
.thumb { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--wall); cursor: zoom-in; }
.entry-body { min-width: 0; display: grid; gap: 4px; }
.head { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.time { font-weight: 700; font-variant-numeric: tabular-nums; }
.chip { padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .78rem; font-weight: 700; }
.chip.bad { background: var(--warn-soft); color: var(--warn); }
.row { overflow-wrap: anywhere; }
.row b { font-weight: 500; color: var(--muted); margin-right: 6px; }
details summary { cursor: pointer; color: var(--accent); font-size: .85rem; }
pre { margin: 6px 0 0; max-height: 320px; overflow: auto; padding: 10px; border-radius: 8px; background: var(--wall); font-size: .78rem; white-space: pre-wrap; overflow-wrap: anywhere; }
a { color: var(--accent); }
.viewer { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .8); cursor: zoom-out; }
.viewer img { max-width: 100%; max-height: 100%; }
@media (max-width: 560px) {
  .entry { grid-template-columns: 72px minmax(0, 1fr); }
  .thumb { width: 72px; height: 72px; }
}
</style>

<body>
<div class="page">
  <header class="top">
    <h1>管理頁面</h1>
    <span class="spacer"></span>
    <a class="btn" href="index.html">回到解題</a>
    <button class="btn" type="button" id="logout" hidden>登出</button>
  </header>

  <div class="card toolbar" id="local-source-toolbar" hidden>
    <label>紀錄來源 <select id="source"><option value="all">全部（本機＋雲端）</option><option value="local">本機紀錄</option><option value="cloud">私人 repo 紀錄</option></select></label>
    <span class="muted" id="local-source-note">本機紀錄保存在這台電腦，重開程式仍可查看。</span>
    <button type="button" class="btn" id="connect-cloud" hidden>連接雲端紀錄</button>
  </div>

  <form class="card login" id="login">
    <label for="password"><b>管理員密碼</b></label>
    <div class="login-row">
      <div class="password-field"><input type="password" id="password" autocomplete="current-password" required><button class="password-eye" type="button" id="password-toggle" aria-controls="password" aria-pressed="false" aria-label="顯示密碼" title="顯示密碼"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18" hidden/></svg></button></div>
      <button class="btn primary" type="submit" id="login-submit">登入</button>
    </div>
    <p class="error" id="login-error" role="alert" hidden></p>
    <p class="muted">公開網站需輸入管理員密碼才能查看設定與紀錄。離開或重新整理後，需再次登入。</p>
  </form>

  <section id="panel" hidden>
    <nav class="admin-tabs" role="tablist" aria-label="管理功能">
      <button type="button" role="tab" id="tab-dashboard" aria-controls="admin-dashboard" aria-selected="true" tabindex="0">看板</button>
      <button type="button" role="tab" id="tab-library" aria-controls="admin-library" aria-selected="false" tabindex="-1">題庫</button>
      <button type="button" role="tab" id="tab-wishes" aria-controls="admin-wishes" aria-selected="false" tabindex="-1">許願</button>
      <button type="button" role="tab" id="tab-teaching" aria-controls="admin-teaching" aria-selected="false" tabindex="-1">教學</button>
      <button type="button" role="tab" id="tab-voice" aria-controls="admin-voice" aria-selected="false" tabindex="-1">語音</button>
    </nav>
    <section class="card data-controls" id="admin-data-controls" aria-label="載入紀錄">
      <div class="load-toolbar"><label for="load-count">載入筆數</label><select id="load-count"><option value="10" selected>最新 10 筆</option><option value="30">最新 30 筆</option><option value="50">最新 50 筆</option><option value="100">最新 100 筆</option><option value="all">全部紀錄</option></select><button class="btn primary" type="button" id="library-refresh">載入</button></div>
      <p class="muted" id="load-status" role="status"></p>
    </section>
    <p class="error" id="load-error" role="alert" hidden></p>
    <section id="admin-dashboard" class="tab-content" role="tabpanel" aria-labelledby="tab-dashboard">
    <div class="card toolbar">
      <label>日期 <select id="day"></select></label>
      <label>裝置 <select id="device"><option value="">全部裝置</option></select></label>
      <label>種類 <select id="kind"><option value="">全部</option><option value="login">登入</option><option value="list">列題</option><option value="solve">解題</option><option value="ask">追問</option><option value="hints">提示生成</option><option value="practice">同類題生成</option><option value="check">作答批改</option><option value="wish">許願</option></select></label>
      <button class="btn" type="button" id="refresh">重新整理</button>
      <span class="summary" id="summary" role="status"></span>
    </div>
      <section class="card usage-stats" id="usage-stats" aria-label="模型用量看板"></section>
      <details class="records-expand" id="admin-records"><summary>逐筆紀錄 <span id="record-count"></span></summary><div class="entries" id="entries"></div></details>
    </section>
    <section class="card" id="admin-library" role="tabpanel" aria-labelledby="tab-library" hidden>

      <h2>所有上傳題目</h2>
      <p class="muted">預設只載入最新 10 筆紀錄。選擇筆數後按「載入」；需要完整紀錄時選「全部紀錄」。查找舊題目可用分類或搜尋，會按條件讀取歷史內容。</p>
      <div class="library-categories">
        <label>上傳日期<select id="admin-library-day"><option value="">全部日期</option></select></label>
        <label>上傳裝置<select id="admin-library-device"><option value="">全部裝置</option></select></label>
        <label>題目來源<select id="admin-library-source"><option value="">全部來源</option><option value="本機">本機</option><option value="雲端">雲端</option></select></label>
        <label>分組方式<select id="admin-library-group"><option value="date">依日期</option><option value="device">依裝置</option><option value="none">不分組</option></select></label>
      </div>
      <div class="library-filters"><input type="search" id="admin-library-search" placeholder="搜尋題目、日期或裝置" aria-label="搜尋題庫"><select id="admin-library-filter" aria-label="題庫篩選"><option value="all">全部狀態</option><option value="unsolved">尚未解答</option><option value="solved">已有解答</option><option value="error">辨識或解題失敗</option><option value="favorite">收藏</option><option value="review">待複習</option></select><button class="btn" type="button" id="library-reset">清除篩選</button></div>
      <p id="admin-library-status" role="status"></p><div id="admin-library-list"></div><button class="btn" type="button" id="library-more" hidden>顯示更多</button>
    </section>
    <section class="card" id="admin-wishes" role="tabpanel" aria-labelledby="tab-wishes" hidden>
      <h2>許願功能</h2><p class="muted compact-note">使用者提出的功能需求，皆列為待開發考量。</p>
      <div class="load-toolbar"><label for="wish-load-count">許願筆數</label><select id="wish-load-count"><option value="10">最新 10 筆</option><option value="30">最新 30 筆</option><option value="all">全部許願</option></select><button class="btn primary" id="wish-refresh" type="button">載入</button></div>
      <input id="wish-search" type="search" aria-label="搜尋已載入許願" placeholder="搜尋已載入的許願" style="width:100%;min-width:0;min-height:44px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)">
      <p id="admin-wish-status" role="status"></p><div id="admin-wish-list"></div>
    </section>
    <form class="card" id="admin-settings" hidden>
      <section id="admin-teaching" role="tabpanel" aria-labelledby="tab-teaching" hidden>
        <h2>教學設定</h2>
<div class="settings-grid">
        <label>解題模型<select id="settings-model"></select></label>
        <label>思考強度<select id="settings-effort"><option value="low">低 · low</option><option value="medium">中 · medium</option><option value="high">高 · high</option></select></label>
        <label>解法<select id="settings-method"></select></label>
        <label>解題方式<select id="settings-mode"><option value="lesson">直接講解</option><option value="hints">逐步提示，先自己作答</option></select></label>
      </div>
        <p class="muted compact-note">依內容判斷學習程度；逐步提示只套用於題目。</p>
      </section>
      <section id="admin-voice" role="tabpanel" aria-labelledby="tab-voice" hidden>
        <h2>語音設定</h2>
<div class="settings-grid">
        <label>預設旁白<select id="voice-enabled"><option value="true">開啟</option><option value="false">關閉</option></select></label>
        <label>中文聲音<select id="voice-chinese"><option value="">自動選擇台灣國語</option></select></label>
        <label>英文聲音<select id="voice-english"><option value="">依口音自動選擇</option></select></label>
        <label>英文口音<select id="voice-englishLang"><option value="en-US">美式英文</option><option value="en-GB">英式英文</option></select></label>
        <label>語速<select id="voice-rate"><option value="0.5">0.5 倍</option><option value="0.75">0.75 倍</option><option value="1">正常</option><option value="1.25">1.25 倍</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option></select></label>
        <label>音調<select id="voice-pitch"><option value="0.75">低</option><option value="1">正常</option><option value="1.25">高</option></select></label>
        <label>音量<select id="voice-volume"><option value="0">靜音</option><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select></label>
      </div>
<div class="study-actions"><button class="btn" type="button" id="voice-test-zh">試聽中文</button><button class="btn" type="button" id="voice-test-en">試聽英文</button><button class="btn" type="button" id="voice-stop">停止試聽</button></div>
        <p id="voice-status" role="status"></p>
        <details class="settings-note"><summary>聲音說明</summary><p class="muted">使用裝置內建朗讀；指定聲音不存在時，選同語言聲音。英文指定聲音優先於口音。學生可自行切換聲音開關。</p></details>
      </section>
      <footer class="settings-footer"><button class="btn primary" id="settings-save">儲存設定</button><p id="settings-status" role="status"></p></footer>
    </form>
  </section>
</div>
<div class="viewer" id="viewer" hidden><img id="viewer-img" alt="使用者拍的照片"></div>
<script type="module" src="js/admin.js?v=f9781be8fc982a44"></script>
</body>
</html>
