<div class="app" id="app" data-view="phone">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="5" width="28" height="20" rx="2.5" class="logo-board"/><path d="M8 19l5-6 4 4 6-8" class="logo-chalk"/><rect x="9" y="26" width="14" height="2.6" rx="1.3" class="logo-tray"/></svg>
      <h1>隨身小老師</h1>
    </div>
  </header>
  <nav class="study-nav" aria-label="學習功能"><button class="btn" id="open-library" type="button" aria-haspopup="dialog">學習經歷</button><button class="btn" id="open-help" type="button" aria-haspopup="dialog">功能說明</button><button class="btn" id="open-wish" type="button" aria-haspopup="dialog">許願功能</button><a class="btn" id="open-admin" href="admin.html" aria-label="管理頁面：輸入管理員密碼">管理頁面</a></nav>

  <main class="layout">
    <section class="desk" aria-labelledby="desk-title">
      <div class="desk-content" id="desk-content">
      <h2 class="sr-only" id="desk-title">拍學習內容</h2>
      <section class="shoot-panel" id="shoot-panel">
        <div class="photo-actions">
          <button class="btn primary big" type="button" id="shoot"><svg class="ic" aria-hidden="true"><use href="#i-photo"/></svg>拍照</button>
          <button class="btn big" type="button" id="album"><svg class="ic" aria-hidden="true"><use href="#i-album"/></svg>相簿</button>
          <button class="btn big" type="button" id="voice-entry"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg>語音</button>
        </div>
        <p class="tip" id="tip">拍照、選相簿或直接說題目；也可以指定範圍做測驗。</p>
      </section>
      <form class="login" id="login" hidden>
        <label for="password">輸入密碼解鎖 Claude</label>
        <div class="login-row">
          <div class="password-field"><input type="password" id="password" autocomplete="current-password" required><button class="password-eye" type="button" id="password-toggle" aria-controls="password" aria-pressed="false" aria-label="顯示密碼" title="顯示密碼"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18" hidden/></svg></button></div>
          <button class="btn primary" type="submit" id="login-submit">登入</button>
        </div>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <p class="login-note">使用時會記錄手機型號、學習內容和老師回覆，只有管理員看得到。不收集手機位置，也不要求定位授權。</p>
      </form>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
      <input type="file" id="file-pick" accept="image/*" hidden>
      </div>
    </section>
    <section class="stage" aria-labelledby="b-title">
      <div class="board" id="board">
        <div class="board-content" id="board-content">
        <header class="board-head">
          <span class="chip" id="b-subject"></span>
          <h2 id="b-title">隨身小老師</h2>
          <span class="chip tag" id="b-tag"></span>
          <div class="head-right">
            <div class="b-status" id="b-status" hidden>
              <span class="chalk-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span id="b-status-text">Claude 正在看學習內容</span>
              <button type="button" class="mini" id="b-stop"><svg class="ic"><use href="#i-stop"/></svg>停止</button>
            </div>
            <button type="button" class="board-photo" id="b-photo" hidden aria-label="看拍到的照片"><img id="b-photo-img" alt=""></button>
          </div>
        </header>
        <p class="board-ai" id="board-ai" hidden></p>
        <div class="problem" id="b-problem"></div>
        <div class="board-work">
        <ol class="answer-steps" id="b-answer-steps" aria-label="完整教學內容" hidden></ol>
        <div class="board-body" id="b-body" data-layout="split">
          <div class="fig-wrap"><svg class="fig" id="b-fig" aria-hidden="true"></svg></div>
          <div class="notes" id="b-notes"></div>
        </div>
        <div class="board-foot">
          <p class="caption" id="b-caption" aria-live="polite" hidden></p>
          <div class="answer" id="b-answer" hidden>
            <span class="answer-label" id="b-answer-label">答案</span>
            <span class="answer-text" id="b-answer-text"></span>
            <span class="answer-actions">
              <button type="button" class="btn chalk play" id="b-again"><svg class="ic"><use href="#i-play"/></svg><span id="b-again-text">再看一次</span></button>
              <button type="button" class="btn chalk ghost" id="b-other" hidden>解這張的別題</button>
              <button type="button" class="btn chalk ghost" id="b-resolve" hidden><svg class="ic"><use href="#i-redo"/></svg>重新講解</button>
            </span>
          </div>
        </div>
        <div class="b-error" id="b-error" hidden>
          <p class="b-error-title" id="b-error-title">看不清楚內容</p>
          <p class="b-error-text" id="b-error-text"></p>
          <div class="b-error-actions">
            <button type="button" class="btn chalk" id="b-retry"><svg class="ic"><use href="#i-redo"/></svg>重新講解</button>
          </div>
        </div>
        <div class="b-pick" id="b-pick" hidden>
          <div class="b-pick-head">
            <img id="b-pick-img" alt="手機拍的照片">
            <div class="b-pick-text">
              <p class="b-pick-title" id="b-pick-title">照片裡有這些內容，想學哪一項？</p>
              <p class="b-pick-hint">點一題就開始解。</p>
            </div>
            <button type="button" class="mini" id="b-pick-close">關閉</button>
          </div>
          <ol class="b-pick-list" id="b-pick-list"></ol>
          <nav class="pick-pages" id="pick-pages" aria-label="學習內容分頁" hidden>
            <button type="button" class="mini" id="pick-prev">上一頁</button>
            <span id="pick-page" aria-live="polite"></span>
            <button type="button" class="mini" id="pick-next">下一頁</button>
          </nav>
        </div>
        <div class="b-ask" id="b-ask" hidden>
          <div class="b-ask-head">
            <p class="b-ask-title" id="b-ask-title">追問這一題</p>
            <button type="button" class="mini" id="b-ask-close">回到講解</button>
          </div>
          <ol class="b-ask-list" id="b-ask-list" aria-live="polite"></ol>
          <form class="b-ask-form" id="b-ask-form">
            <button type="button" class="ask-mic" id="ask-mic" aria-label="用說的" aria-pressed="false" hidden><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></button>
            <input type="text" id="ask-input" placeholder="想問什麼？例如：為什麼要除以 2？" autocomplete="off" enterkeyhint="send" aria-label="追問的問題">
            <button type="submit" class="ask-send" id="ask-send" aria-label="送出"><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
          </form>
          <div class="ask-shortcuts"><button type="button" class="mini" data-ask="這一步為什麼要這樣做？">這一步為什麼？</button><button type="button" class="mini" data-ask="請換個更簡單的方式解釋這一步。">換個方式說</button><button type="button" class="mini" data-ask="我算的是：">我算的是…</button></div>
          <p class="b-ask-hint" id="ask-hint" role="status"></p>
        </div>
        <div class="photo-view" id="photo-view" hidden><img id="photo-view-img" alt="拍到的照片"><button type="button" class="mini" id="photo-close">關閉</button></div>
        </div>
        </div>
      </div>
      <div class="lesson-status"><div class="dots" id="t-dots" aria-label="步驟"></div><span class="step-count" id="t-count"></span>
        <p class="voice-feedback" id="voice-feedback" role="status" hidden></p>
      </div>
      <div class="floating-controls" role="toolbar" aria-label="播放控制">
        <div class="playback-controls" role="group" aria-label="步驟播放">
        <button type="button" class="round-control" id="t-prev" aria-label="上一步" title="上一步（←）"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg><span>上步</span></button>
        <button type="button" class="round-control" id="t-play" aria-label="播放" title="播放／暫停（P）"><svg class="ic" aria-hidden="true"><use href="#i-play" id="t-play-icon"/></svg><span id="t-play-label">播放</span></button>
        <button type="button" class="round-control" id="t-next" aria-label="下一步" title="下一步（→）"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg><span>下步</span></button>
        </div>
        <div class="learning-controls" role="group" aria-label="學習操作">
        <button type="button" class="round-control" id="t-answer" aria-label="列出完整教學內容與答案，跳過動畫與朗讀" title="列出完整教學內容與答案，跳過動畫與朗讀"><span class="answer-icon" aria-hidden="true">✓</span><span>重點</span></button>
        <button type="button" class="round-control" id="t-questions" aria-label="回到內容選擇" title="回到內容選擇" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span>選內容</span></button>
        <button type="button" class="round-control" id="t-ask" aria-label="追問這一題" title="追問這一題" disabled><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span>追問</span></button>
        <button type="button" class="round-control" id="open-tools" aria-label="學習工具：收藏、標記、提示、出題" aria-haspopup="dialog" title="學習工具" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5zM8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>工具</span></button>
        <button type="button" class="round-control" id="t-voice" aria-pressed="true" aria-label="語音旁白" title="語音旁白"><svg class="ic" aria-hidden="true"><use href="#i-sound" id="t-voice-icon"/></svg><span>聲音</span></button>
        </div>
      </div>
    </section>
  </main>
</div>
